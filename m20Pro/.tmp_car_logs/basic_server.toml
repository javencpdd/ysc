
[DataCollect]
Topic = [
'/image_raw','/fibo_fusion_ecef','/turn_mark','/LIO_ODOM',
'/NAV_POINTS','/grid_map_3d','/target_goal_baselink',
'/track_path_baselink','/LIDAR/POINTS','/IMU','/GPS',
'/accumulate_cloud/cloud_base','/passable_area','/impassable_area',
'/grid_map','/traversal_cost',
]
recordEnable = false
aMapEnable = false

[VelControl]
autoResetJointsZero = false

[FibocomGPS]
