# See Odin-Nav-Stack/docs/TUNING_GUIDE.md for more details

# mpc
receding: 8
step_time: 0.1
ref_speed: 0.5
device: 'cpu'
time_print: False
collision_threshold: 0.05

# robot
robot:
  kinematics: 'diff'
  max_speed: [0.5, 0.7]
  max_acce: [0.5, 0.7]
  length: 0.7
  width: 0.35
  # vertices: [[-0.8, -1.0], [-0.8, 1.0], [0.8, 1.0], [0.8, -1.0]] 

# initial path
ipath:
  interval: 0.1
  waypoints: []
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 0.2
  loop: False
  arrive_threshold: 0.2
  close_threshold: 0.1
  ind_range: 30
  arrive_index_threshold: 1
  
# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/dune_train/model/go2/model_5000.pth'


# adjust parameters
adjust:
  q_s: 1.0
  q_theta: 1.0
  p_u: 1.0
  p_w: 0.8
  p_w_cross: 0.0
  eta: 12.0
  ro_obs: 400
  d_max: 0.25
  d_min: 0.02
  bk: 0.4

